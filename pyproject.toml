[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "run-nagios-passive-check-and-submit"
version = "0.1.5"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "requests",
    "termcolor",
    "beautifulsoup4",
    "lxml",
]

[project.optional-dependencies]
test = []

[tool.setuptools]
packages = { find = {} }
script-files = ["run-nagios-passive-check-and-submit"]
